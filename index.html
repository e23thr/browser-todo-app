<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy per PROJECT_ANALYSIS.md section 7.2, shipped as a <meta> tag
      because GitHub Pages cannot set custom response headers (section 7.2 / 9.5, PO Q11).

      Documented exception: `frame-ancestors` is dropped — it is ignored inside meta CSP and the
      app has no cookies or sessions to protect (see README, "CSP exception").

      The `sha256-…` source in `script-src` below is computed at build time from the SHA-256 of
      the inline theme-boot snippet — the only inline script this policy permits.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-__THEME_BOOT_SHA256__'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A local-first, privacy-preserving todo app that runs entirely in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Todo — local-first</title>
    <!--
      No-flash theme boot (design §5.2 / M7): reads the ADR-002 boot-prefs mirror
      (`todo:prefs:v1:theme`) and paints <html data-theme> before first paint. Anything that is
      not an explicit "light" behaves as `system`, matching readThemePref() in src/app/theme.ts.
      If localStorage throws (private mode) nothing is applied and the CSS prefers-color-scheme
      fallback in tokens.css paints the page (§5.2 failure semantics).
    -->
    <script id="theme-boot">
      (function () {
        try {
          var pref = localStorage.getItem('todo:prefs:v1:theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage or matchMedia unavailable: paint from the CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
