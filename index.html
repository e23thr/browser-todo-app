<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy per PROJECT_ANALYSIS.md section 7.2, shipped as a <meta> tag
      because GitHub Pages cannot set custom response headers (section 7.2 / 9.5, PO Q11).

      Documented exception 1: `frame-ancestors` is dropped — it is ignored inside meta CSP and the
      app has no cookies or sessions to protect (see README, "CSP exception").

      Documented exception 2 (V1 WebDAV sync, ADR-006 Addendum A): `connect-src` is widened from
      `'self'` to `'self' https: <plain-HTTP loopback>`. Sync runs against a USER-PROVIDED WebDAV
      origin, which cannot be enumerated in a static policy, so the source list is exactly as wide
      as the engine's own allow-list (`assertSecureRemote`: any https host, plus plain-HTTP
      localhost/127.0.0.1 for development) and never narrower — otherwise this policy silently
      blocks what the app itself offers the user (defect B2: failures surfaced as CORS/server
      errors when the real blocker was this line). Plain-HTTP egress to any non-loopback host
      stays blocked (https: scheme source + mixed-content blocking); `upgrade-insecure-requests`
      is deliberately NOT set — the engine refuses insecure URLs with an explicit error instead of
      silently rewriting them. The no-external-refs bundle gate allow-lists the loopback source
      expressions as policy text (scripts/bundle-budgets.json).

      The `sha256-…` source in `script-src` below is computed at build time from the SHA-256 of
      the inline theme-boot snippet — the only inline script this policy permits.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-__THEME_BOOT_SHA256__'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      The <title> and description below are a STATIC ENGLISH PRE-PAINT FALLBACK, not a second
      source of truth: app code (src/i18n/documentMeta.ts, wired after initLocale in
      src/app/main.tsx) overwrites both from the `app.documentTitle` / `app.metaDescription`
      catalog keys as soon as the locale pack lands, and on every locale switch afterwards.
      Documented account of QA defect D1 — see docs/i18n/README.md §4. No inline script may
      do this: the CSP permits only the theme-boot snippet below.
    -->
    <meta
      name="description"
      content="A local-first, privacy-preserving todo app that runs entirely in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      PWA install surface (ADR-008, S13). The manifest itself is generated at build time with
      the configured base path baked into start_url/scope (scripts/webmanifest.mjs, emitted by
      the `app:webmanifest` Vite plugin) — the href below is rewritten to that same base at
      build time. Icons are self-hosted under /icons/ (ADR-008 Decision 2: zero third-party
      bytes). The apple-* meta tags give iOS Safari a real home-screen install (it ignores
      `display: standalone` in the manifest for the Add to Home Screen flow).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <title>Todo — local-first</title>
    <!--
      No-flash theme boot (design §5.2 / M7): reads the ADR-002 boot-prefs mirror
      (`todo:prefs:v1:theme`) and paints <html data-theme> before first paint. Anything that is
      not an explicit "light" behaves as `system`, matching readThemePref() in src/app/theme.ts.
      If localStorage throws (private mode) nothing is applied and the CSS prefers-color-scheme
      fallback in tokens.css paints the page (§5.2 failure semantics).
    -->
    <script id="theme-boot">
      (function () {
        try {
          var pref = localStorage.getItem('todo:prefs:v1:theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage or matchMedia unavailable: paint from the CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
