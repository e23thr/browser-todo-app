name: Nightly

# ADR-001 §7: `e2e-full` runs the cross-browser matrix plus the Thai-locale pass, and a weekly
# scheduled full dependency audit runs over every dependency (prod gate stays in ci.yml).
on:
  schedule:
    - cron: '17 3 * * *' # nightly
    - cron: '30 4 * * 1' # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  e2e-full:
    name: e2e-full (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    env:
      # §9.1 boot budget: this job runs the offline/update/SW suites (tests/e2e/*.spec.ts under
      # the main config), so it holds the real 300 ms start-to-interactive line. Without this
      # variable tests/e2e/sw-utils.ts falls back to the loose 1500 ms flake guard.
      E2E_BOOT_BUDGET_MS: '300'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # §9.1 perf-evidence protocol: `tests/e2e/qa-search-reorder.spec.ts` measures per-keystroke
      # search latency and only exists in the chromium project (it skips the others), and its
      # header states the measurement contract — "one worker, fresh profile per test". The matrix
      # default (2 workers) let a sibling suite's CPU contention inflate those numbers, which is
      # exactly what reddened nightly run 40242355014 (cold index open measured 86.7 -> 105.5 ->
      # 115.0 -> 117.1 ms of the app's OWN page clock across attempts of the same code; split
      # evidence: scripts/diag-search-budget-split.mjs, whose calibration loop runs 5.4 ms on an
      # idle box and 41.5 ms on a saturated one). The budgets themselves are unchanged — this
      # only makes CI measure them under the conditions the spec documents.
      - name: Full E2E suite (chromium — single worker for the perf-evidence protocol)
        if: matrix.browser == 'chromium'
        run: npx playwright test --project=chromium --workers=1
      - name: Full E2E suite
        if: matrix.browser != 'chromium'
        run: npx playwright test --project=${{ matrix.browser }}

  e2e-thai-locale:
    name: e2e-full (th-TH locale)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Thai-locale pass (§8 — string translations arrive with the i18n epic, M15)
        run: npx playwright test --project=chromium-th

  full-audit:
    name: full-audit
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production gate (fails on high/critical)
        run: npm run audit:gate
      - name: Full report over every dependency (informational)
        run: |
          set +e
          npm audit --audit-level=low > audit-report.txt 2>&1
          status=$?
          {
            echo "## Full dependency audit"
            echo
            echo '```'
            cat audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "npm audit exit code: $status (informational — dev advisories warn only, §7.2)"
          exit 0
